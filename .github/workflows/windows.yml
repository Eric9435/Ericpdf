name: EricPDF Windows EXE
on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Windows app and packaging dependencies
        run: python -m pip install --upgrade pip pyinstaller && python -m pip install -r windows/requirements.txt
      - name: Check syntax
        run: python -m py_compile windows/ericpdf_windows.py
      - name: Build portable Windows desktop application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name EricPDF-Windows --collect-all vosk --collect-all sounddevice windows/ericpdf_windows.py
          if (!(Test-Path "dist/EricPDF-Windows.exe")) { throw "Windows executable missing" }
      - name: Publish Windows exe
        uses: actions/upload-artifact@v4
        with:
          name: EricPDF-Windows-exe
          path: dist/EricPDF-Windows.exe
          if-no-files-found: error
